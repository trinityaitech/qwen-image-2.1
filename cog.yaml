build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - "git"
    - "wget"
    - "curl"
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
  python_packages:
    - "pydantic<2"
    - "websocket-client"
    - "requests"
  run:
    - "python -m venv /root/comfy_env"
    - "/root/comfy_env/bin/pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu121"
    - "git clone https://github.com/comfyanonymous/ComfyUI.git /root/ComfyUI"
    - "/root/comfy_env/bin/pip install --no-cache-dir -r /root/ComfyUI/requirements.txt"
    - "mkdir -p /root/ComfyUI/custom_nodes"
    - "git clone https://github.com/city96/ComfyUI-GGUF.git /root/ComfyUI/custom_nodes/ComfyUI-GGUF"
    - "/root/comfy_env/bin/pip install --no-cache-dir websocket-client requests pillow safetensors accelerate einops sentencepiece"
    - "mkdir -p /root/ComfyUI/models/diffusion_models /root/ComfyUI/models/text_encoders /root/ComfyUI/models/vae /root/ComfyUI/input"

predict: "predict.py:Predictor"