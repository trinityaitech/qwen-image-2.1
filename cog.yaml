build:
  gpu: true
  cuda: "12.4"
  python_version: "3.11"
  system_packages:
    - "git"
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
  python_packages:
    - "torch>=2.4.0"
    - "torchvision"
    - "transformers>=5.17"
    - "git+https://github.com/huggingface/diffusers"
    - "accelerate"
    - "pillow"
    - "hf_transfer"
    - "huggingface_hub"
  run:
    - "pip install --upgrade pip"

predict: "predict.py:Predictor"